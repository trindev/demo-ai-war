services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # ใส่ค่าในไฟล์ .env (ดู .env.example) ถ้าไม่ใส่ ระบบจะใช้ผลแยกขยะแบบจำลอง
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # บัญชีตัวอย่าง: รหัสผ่านร่วมของทุกบัญชี และเปิดหรือปิดปุ่ม quick login (ตั้งเป็น 0 เพื่อปิด)
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
      DEMO_QUICK_LOGIN: ${DEMO_QUICK_LOGIN:-1}
      # ที่อยู่ API ของ GrowGreen (ลงท้ายด้วย /api/v1) ถ้าไม่ใส่ การเชื่อมต่อ GrowGreen ทำงานในโหมดดูตัวอย่าง ไม่ส่งจริง
      GROWGREEN_API_URL: ${GROWGREEN_API_URL:-}
      # API key ของ GrowGreen ที่ใช้เมื่อบริษัทกดเชื่อมต่อโดยไม่ใส่ key ของตัวเอง (เหมาะกับเดโมที่มีองค์กรเดียว)
      GROWGREEN_API_KEY: ${GROWGREEN_API_KEY:-}
    volumes:
      - data:/data
      # แก้โค้ดแล้วเห็นผลทันทีโดยไม่ต้อง build ใหม่
      - ./app:/srv/app
      - ./web:/srv/web
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/srv/app"]
    restart: unless-stopped
volumes:
  data:
